<div class="page-container">
  <div class="action-row">
    <h2 style="margin:0">Owners</h2>
    <span class="spacer"></span>
    <button mat-flat-button color="primary" routerLink="/owners/new">
      <mat-icon>add</mat-icon> Add Owner
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search owners</mat-label>
        <input matInput [formControl]="searchControl" placeholder="Name...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="owners" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let o">{{ o.firstName }} {{ o.lastName }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let o">{{ o.email || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let o">{{ o.phone || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let o">{{ o.address || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="animals">
          <th mat-header-cell *matHeaderCellDef>Animals</th>
          <td mat-cell *matCellDef="let o">{{ o.animalCount }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let o">
            <button mat-icon-button [routerLink]="['/owners', o.id, 'edit']" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(o)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <p *ngIf="owners.length === 0" class="empty-message">No owners found.</p>
    </mat-card-content>
  </mat-card>
</div>
