<div class="page-container">
  <div class="action-row">
    <button mat-button routerLink="/owners">
      <mat-icon>arrow_back</mat-icon> Owners
    </button>
    <h2 style="margin:0">{{ isEdit ? 'Edit Owner' : 'New Owner' }}</h2>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" class="owner-form">
        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>First Name *</mat-label>
            <input matInput formControlName="firstName">
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Last Name *</mat-label>
            <input matInput formControlName="lastName">
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/owners">Cancel</button>
          <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">
            {{ isEdit ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
